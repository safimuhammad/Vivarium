[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium"
version = "0.1.0"
description = "An open-ended multi-agent simulation: a never-ending generative art piece where LLM-powered agents exist, compete, trade, fight, and reproduce."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Safi" }]
dependencies = [
    "ollama",
    "rich",
    "pyyaml",
    "faker",
    "pydantic>=2",
    # Embedded vector store (PersistentClient + all-MiniLM-L6-v2) for memory RAG.
    "chromadb",
    # Hosted decider backend (the optional "gemini" provider; imported lazily so the
    # local Ollama-only path never requires it).
    "google-genai",
    # Async transport for the Gemini client: we pin to httpx (google-genai 2.10.0 +
    # aiohttp 3.14.x trips an internal connector assertion). Always present via
    # google-genai, declared directly because agents.gemini_decider imports it.
    "httpx",
    # Loads the gitignored .env so a hosted provider's key (GEMINI_API_KEY) is present.
    "python-dotenv",
    # Browser-facing live API for the frontend observer.
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # Gate tools are PINNED EXACTLY, on purpose. `ruff format --check` and
    # `mypy --strict` are pass/fail gates whose verdict depends on the tool
    # version: ruff's formatter output legitimately changes between releases and
    # mypy gains checks. Unpinned, CI resolved the newest release on each clean
    # run while developers kept older wheels, so the format gate could go red on
    # a commit that changed nothing and no local run could reproduce it. Bump
    # these deliberately, and reformat/re-typecheck in the same commit.
    "ruff==0.16.4",
    "mypy==2.3.1",
    # Git pre-commit hook runner (ruff + mypy + fast pytest); see
    # `.pre-commit-config.yaml`.
    "pre-commit",
    # Used only by the relocated live-Ollama integration prototype so pytest can
    # import (collect) it; not a runtime dependency.
    "requests",
    # Type stubs for mypy (consumed by config/loader in later phases).
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = [
    "world*",
    "bus*",
    "tools*",
    "config*",
    "core*",
    "agents*",
    "observability*",
    "memory*",
    "server*",
]
exclude = ["tests*"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
# Relocated live-Ollama prototypes kept as-is (legacy style); they are collected
# by pytest under the `integration` marker but not linted/formatted by this pass.
# Do NOT format Markdown. ruff 0.16 began formatting Python code blocks inside
# .md files; our design docs quote FRAGMENTS (an indented arm of a larger
# expression, a snippet of a function body), not complete programs. Formatting
# them as standalone modules rewrites their meaning -- it split an implicit
# string concatenation into two separate statements, silently changing the
# string a reader would copy. Prose is reviewed by humans, not by a Python
# formatter.
extend-exclude = ["tests/integration", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modern type syntax, etc.)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and don't need the same naming/annotation rigor.
"tests/**" = ["N802", "N803", "N806"]

# Author-once art-pipeline generator scripts (run by hand, verified by eye,
# not imported by runtime code). Their long lines are data tables (pixel/
# polygon coordinates, palette tuples) and absolute output paths, not
# reformattable code — every other rule still applies to these files.
"frontend/scripts/**" = ["E501"]

# ---------------------------------------------------------------------------
# Mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
# Left off intentionally: the narrow Phase-1 gate (`mypy core tests`) does not
# exercise every per-module override (those are for the full CI run across
# world/bus/tools/config), which would otherwise emit "unused section" notes.
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# All first-party packages are now held to the strict bar. Only the relocated
# live-Ollama integration prototypes/smoke remain relaxed (legacy script style,
# excluded from the default run).
[[tool.mypy.overrides]]
module = [
    "tests.integration.*",
]
ignore_errors = true
follow_imports = "skip"

# Third-party packages without bundled type information.
[[tool.mypy.overrides]]
module = [
    "ollama.*",
    "faker.*",
    "yaml.*",
    "requests.*",
    "chromadb.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
python_files = "*_test.py"
asyncio_mode = "auto"
addopts = "-m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: live-LLM/Ollama or other external-service tests; excluded from the default run.",
]

# ---------------------------------------------------------------------------
# Coverage (core packages, >=90%)
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = [
    "world",
    "bus",
    "tools",
    "config",
    "core",
    "agents",
    "observability",
    "memory",
    "scripts",
    "server",
]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
