name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # The built-live smoke runs here, not on every push -- see the
  # `frontend-live-smoke` job. 09:00 UTC is ~02:00 PT.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type-check · test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (dev) dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy core tests world bus tools config agents observability

      - name: Pytest with coverage (integration excluded)
        run: >-
          pytest
          --cov=world --cov=bus --cov=tools --cov=config --cov=core
          --cov=agents --cov=observability
          --cov-report=term-missing
          --cov-fail-under=90

  frontend-live:
    name: frontend contracts · build · bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install root Node dependencies
        run: npm ci

      - name: Install frontend Node dependencies
        run: npm ci --prefix frontend

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      # The capture-handoff contract encodes PNG sequences into WebM/MP4 to
      # verify timing parity, so it needs the ffmpeg BINARY, not an npm package.
      # Developer machines have it; the runner image does not, and this step had
      # never executed in CI, so the omission was invisible. Without it the
      # oracles test file aborts wholesale (reported as one failing test, hiding
      # ~55 subtests) rather than failing on anything it actually asserts.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Frontend unit tests
        run: npm run test:frontend:unit

      - name: Frontend capture handoff contract
        run: npm run test:frontend:capture-handoff

      - name: Frontend live unit tests
        run: npm run test:frontend:live:unit

      - name: Frontend real-provider guard
        run: npm run test:frontend:live:real:guard

      - name: Frontend build
        run: npm run build:frontend

      - name: Frontend bundle budget
        run: npm run test:frontend:bundle

  # The built-live smoke drives a real three.js world, a live SSE stream and a
  # mechanics burst against the built bundle. On a runner rasterising WebGL in
  # software it costs ~951s -- 16 minutes, against 24s for the build and 6s for
  # the bundle budget beside it. That is honest cost for what it covers, but it
  # is too much to spend on every push, so it runs nightly and on demand
  # (`workflow_dispatch`) instead. Everything it depends on -- the unit suites,
  # the capture-handoff contract, the build and the bundle budget -- still gates
  # every push in `frontend-live` above.
  #
  # It builds its own bundle: the Playwright config's `webServer` runs
  # `build:frontend` before serving the preview, so no build step is needed here.
  # ffmpeg is not needed either -- that is the capture-handoff contract's
  # dependency, and that contract stays on the push path.
  # Nightly, but only when there is something new to smoke. Compares HEAD against
  # the head SHA of the previous COMPLETED scheduled run: unchanged means nobody
  # pushed since the last nightly, so the 16-minute job would re-test bytes it has
  # already tested. Ten pushes in a day still produce exactly one nightly run, on
  # the latest commit -- the gate keys on "did main move", not on how often.
  # A manual `workflow_dispatch` always runs: asking for it IS the intent.
  smoke-gate:
    name: did main move since the last smoke?
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}

    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run -- always smoking"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `status=completed` excludes this run, which is still in progress.
          previous=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ -z "$previous" ]; then
            echo "no previous scheduled run -- smoking"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$previous" != "$HEAD_SHA" ]; then
            echo "main moved: $previous -> $HEAD_SHA -- smoking"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "main unchanged since $previous -- nothing new to smoke, skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-live-smoke:
    name: built live smoke (nightly)
    runs-on: ubuntu-latest
    needs: smoke-gate
    if: needs.smoke-gate.outputs.should_run == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install root Node dependencies
        run: npm ci

      - name: Install frontend Node dependencies
        run: npm ci --prefix frontend

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Built frontend live API smoke
        run: npm run test:frontend:live:built -- --reporter=line
