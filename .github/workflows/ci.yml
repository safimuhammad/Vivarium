name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type-check · test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (dev) dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy core tests world bus tools config agents observability

      - name: Pytest with coverage (integration excluded)
        run: >-
          pytest
          --cov=world --cov=bus --cov=tools --cov=config --cov=core
          --cov=agents --cov=observability
          --cov-report=term-missing
          --cov-fail-under=90

  frontend-live:
    name: frontend built live smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install root Node dependencies
        run: npm ci

      - name: Install frontend Node dependencies
        run: npm ci --prefix frontend

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      # The capture-handoff contract encodes PNG sequences into WebM/MP4 to
      # verify timing parity, so it needs the ffmpeg BINARY, not an npm package.
      # Developer machines have it; the runner image does not, and this step had
      # never executed in CI, so the omission was invisible. Without it the
      # oracles test file aborts wholesale (reported as one failing test, hiding
      # ~55 subtests) rather than failing on anything it actually asserts.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Frontend unit tests
        run: npm run test:frontend:unit

      - name: Frontend capture handoff contract
        run: npm run test:frontend:capture-handoff

      - name: Frontend live unit tests
        run: npm run test:frontend:live:unit

      - name: Frontend real-provider guard
        run: npm run test:frontend:live:real:guard

      - name: Frontend build
        run: npm run build:frontend

      - name: Frontend bundle budget
        run: npm run test:frontend:bundle

      - name: Built frontend live API smoke
        run: npm run test:frontend:live:built -- --reporter=line
